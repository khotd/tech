services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports: ["5672:5672", "15672:15672"]
    environment: {RABBITMQ_DEFAULT_USER: guest, RABBITMQ_DEFAULT_PASS: guest}
    healthcheck: {test: ["CMD", "rabbitmqctl", "status"], interval: 5s, timeout: 5s, retries: 5}

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 3s, retries: 5}

  tester:
    build: .
    environment:
      RABBIT_URL: "amqp://guest:guest@rabbitmq:5672/"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["./report:/app/report"]